apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skin-disease

resources:
  # Namespace
  - namespaces/namespace.yaml

  # Secrets and ConfigMaps
  - secrets/secrets.yaml
  - configmaps/configmap.yaml

  # Persistent Volume Claims
  - pvc/pvc.yaml

  # StatefulSets (Infrastructure)
  - statefulsets/postgres.yaml
  - statefulsets/redis.yaml
  - statefulsets/rabbitmq.yaml
  - statefulsets/minio.yaml

  # Services
  - services/services.yaml

  # Deployments (Applications)
  - deployments/api-gateway.yaml
  - deployments/auth-service.yaml
  - deployments/prediction-service.yaml
  - deployments/admin-service.yaml
  - deployments/celery-worker.yaml

  # Ingress
  - ingress/ingress.yaml

  # Horizontal Pod Autoscalers
  - hpa/hpa.yaml

commonLabels:
  app.kubernetes.io/name: skin-disease-ai
  app.kubernetes.io/managed-by: kustomize
