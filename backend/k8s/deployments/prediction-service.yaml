apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  namespace: skin-disease
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
    spec:
      containers:
        - name: prediction-service
          image: skin-disease-ai/prediction-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: ENV
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: DEBUG
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: PREDICTION_DATABASE_URL
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/2
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skin-disease-secrets
                  key: REDIS_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: RABBITMQ_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: CELERY_RESULT_BACKEND
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skin-disease-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skin-disease-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: MINIO_BUCKET
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: MODEL_PATH
            - name: CLASS_MAPPING_PATH
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: CLASS_MAPPING_PATH
          volumeMounts:
            - name: ml-models
              mountPath: /app/models
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models-pvc
