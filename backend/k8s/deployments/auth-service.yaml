apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: skin-disease
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: skin-disease-ai/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: ENV
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: DEBUG
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: AUTH_DATABASE_URL
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/1
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skin-disease-secrets
                  key: REDIS_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skin-disease-secrets
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: REFRESH_TOKEN_EXPIRE_DAYS
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
