apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: skin-disease
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: skin-disease-ai/admin-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: ENV
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: DEBUG
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: ADMIN_DATABASE_URL
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/4
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skin-disease-secrets
                  key: REDIS_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: RABBITMQ_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: AUTH_SERVICE_URL
            - name: PREDICTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: skin-disease-config
                  key: PREDICTION_SERVICE_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
