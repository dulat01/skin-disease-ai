---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: skin-disease
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: skin-disease
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: skin-disease
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: skin-disease
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: skin-disease
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: skin-disease
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: prediction-service
  namespace: skin-disease
spec:
  selector:
    app: prediction-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: skin-disease
spec:
  selector:
    app: admin-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
